name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: linux-x64
            artifact_name: ncm-cloud-linux
          - os: windows-latest
            platform: win
            target: windows-x64
            artifact_name: ncm-cloud-win.exe
          - os: macos-latest
            platform: mac
            target: darwin-arm64
            artifact_name: ncm-cloud-mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun scripts/build.ts ${{ matrix.target }}

      - name: Rename artifact
        run: |
          cd artifacts
          if [ -f "ncm-cloud" ]; then
            mv ncm-cloud ${{ matrix.artifact_name }}
          elif [ -f "ncm-cloud.exe" ]; then
            mv ncm-cloud.exe ${{ matrix.artifact_name }}
          fi

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List artifacts
        run: ls -la release-assets/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/ncm-cloud-linux
            release-assets/ncm-cloud-win.exe
            release-assets/ncm-cloud-mac
